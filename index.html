<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global EcoPulse | Live Financial News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .high-impact { border-left: 4px solid #ef4444; }
        .med-impact { border-left: 4px solid #f59e0b; }
        .low-impact { border-left: 4px solid #10b981; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const API_KEY = 'd7p2ldhr01qr68pbg1l0d7p2ldhr01qr68pbg1lg'; // Your Provided Key

        function App() {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedCountry, setSelectedCountry] = useState('All');
            const [impactFilter, setImpactFilter] = useState('All');
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);

            // Countries that affect the Indian Market the most
            const countries = ["All", "IN", "US", "CN", "JP", "GB", "EU"];

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 60000); // Auto-update every 1 minute
                return () => clearInterval(interval);
            }, [selectedDate]);

            const fetchData = async () => {
                setLoading(true);
                try {
                    // Finnhub Economic Calendar Endpoint
                    const response = await fetch(`https://finnhub.io/api/v1/calendar/economic?from=${selectedDate}&to=${selectedDate}&token=${API_KEY}`);
                    const data = await response.json();
                    setEvents(data.economicCalendar || []);
                } catch (error) {
                    console.error("Error fetching data:", error);
                }
                setLoading(false);
            };

            const calculateBias = (actual, estimate, eventName) => {
                if (!actual || !estimate) return { label: "Neutral", color: "text-slate-400" };
                const isPositiveGood = !eventName.toLowerCase().includes("unemployment");
                
                if (actual > estimate) {
                    return isPositiveGood ? { label: "Bullish", color: "text-green-600" } : { label: "Bearish", color: "text-red-600" };
                } else if (actual < estimate) {
                    return isPositiveGood ? { label: "Bearish", color: "text-red-600" } : { label: "Bullish", color: "text-green-600" };
                }
                return { label: "Neutral", color: "text-slate-400" };
            };

            const filteredEvents = useMemo(() => {
                return events.filter(e => {
                    const countryMatch = selectedCountry === 'All' || e.country === selectedCountry;
                    const impactMap = { '1': 'High', '2': 'Med', '3': 'Low' };
                    const impactMatch = impactFilter === 'All' || impactMap[e.impact] === impactFilter;
                    return countryMatch && impactMatch;
                });
            }, [events, selectedCountry, impactFilter]);

            return (
                <div class="min-h-screen">
                    <nav class="glass sticky top-0 z-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
                        <h1 class="text-xl font-bold text-indigo-600"><i class="fas fa-chart-line mr-2"></i>FinPulse Live</h1>
                        <div class="flex items-center gap-4">
                            <span class="text-xs font-medium bg-green-100 text-green-700 px-2 py-1 rounded-full animate-pulse">Live Updates ON</span>
                        </div>
                    </nav>

                    <div class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
                        <aside class="space-y-6">
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                <h2 class="font-semibold mb-4 text-slate-700">Control Panel</h2>
                                
                                <div class="space-y-4">
                                    <div>
                                        <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Date</label>
                                        <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} class="w-full border p-2 rounded-lg text-sm bg-slate-50"/>
                                    </div>

                                    <div>
                                        <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Region (Impacting India)</label>
                                        <select value={selectedCountry} onChange={(e) => setSelectedCountry(e.target.value)} class="w-full border p-2 rounded-lg text-sm bg-slate-50">
                                            {countries.map(c => <option key={c} value={c}>{c === 'IN' ? '🇮🇳 India' : c === 'US' ? '🇺🇸 USA' : c}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Impact Level</label>
                                        <div class="flex flex-col gap-2">
                                            {['All', 'High', 'Med', 'Low'].map(level => (
                                                <button key={level} onClick={() => setImpactFilter(level)} class={`text-left px-3 py-2 rounded-lg text-sm transition ${impactFilter === level ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100'}`}>
                                                    {level}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        <main class="md:col-span-3 space-y-4">
                            {loading ? (
                                <div class="flex justify-center py-20"><i class="fas fa-circle-notch animate-spin text-3xl text-indigo-600"></i></div>
                            ) : filteredEvents.length > 0 ? (
                                filteredEvents.map((event, idx) => {
                                    const bias = calculateBias(event.actual, event.estimate, event.event);
                                    const istTime = new Date(event.time).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' });
                                    const impactClass = event.impact === '1' ? 'high-impact' : event.impact === '2' ? 'med-impact' : 'low-impact';

                                    return (
                                        <div key={idx} class={`bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4 transition hover:shadow-md ${impactClass}`}>
                                            <div class="flex-1">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">{event.country}</span>
                                                    <span class="text-xs font-medium text-slate-400">{istTime} IST</span>
                                                </div>
                                                <h3 class="font-bold text-slate-800">{event.event}</h3>
                                            </div>

                                            <div class="flex gap-8 items-center border-t md:border-t-0 md:border-l border-slate-100 pt-4 md:pt-0 md:pl-6">
                                                <div class="text-center">
                                                    <p class="text-[10px] text-slate-400 uppercase font-bold">Actual</p>
                                                    <p class="font-mono font-bold text-indigo-600">{event.actual || '--'}</p>
                                                </div>
                                                <div class="text-center">
                                                    <p class="text-[10px] text-slate-400 uppercase font-bold">Consensus</p>
                                                    <p class="font-mono text-slate-600">{event.estimate || '--'}</p>
                                                </div>
                                                <div class="text-center min-w-[70px]">
                                                    <p class="text-[10px] text-slate-400 uppercase font-bold">Bias</p>
                                                    <p class={`text-xs font-bold ${bias.color}`}>{bias.label}</p>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })
                            ) : (
                                <div class="bg-white p-10 rounded-2xl border-2 border-dashed border-slate-200 text-center">
                                    <p class="text-slate-500">No major news events found for this filter/date.</p>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
