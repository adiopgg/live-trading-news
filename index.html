<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingPulse Pro | Full Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkBg: '#0b0f1a', darkCard: '#161b2a' } } }
        }
    </script>
    <style>
        .impact-high { border-left: 6px solid #ef4444; }
        .impact-med { border-left: 6px solid #f59e0b; }
        .impact-low { border-left: 6px solid #10b981; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-slow { animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-slate-100 transition-colors">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const API_KEY = 'd7p2ldhr01qr68pbg1l0d7p2ldhr01qr68pbg1lg';

        function App() {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [selectedCountries, setSelectedCountries] = useState(["IN", "US", "CN", "JP"]);
            const [selectedImpacts, setSelectedImpacts] = useState(["High", "Medium", "Low"]);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', isDarkMode);
                fetchData();
            }, [date, isDarkMode]);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const response = await fetch(`https://finnhub.io/api/v1/calendar/economic?from=${date}&to=${date}&token=${API_KEY}`);
                    const data = await response.json();
                    setEvents(data.economicCalendar || []);
                } catch (err) { console.error(err); }
                setLoading(false);
            };

            const toggleFilter = (list, setList, item) => {
                setList(prev => prev.includes(item) ? prev.filter(i => i !== item) : [...prev, item]);
            };

            const getImpactData = (val) => {
                const v = val?.toString().toLowerCase();
                if (v === "1" || v === "high") return { label: "High", color: "text-red-500", class: "impact-high" };
                if (v === "2" || v === "medium" || v === "med") return { label: "Medium", color: "text-orange-500", class: "impact-med" };
                return { label: "Low", color: "text-green-500", class: "impact-low" };
            };

            // NIFTY BIAS LOGIC
            const getNiftyBias = (event, actual, estimate) => {
                if (!actual || !estimate) return { label: "AWAITING", color: "text-slate-400", icon: "fa-clock" };
                const act = parseFloat(actual);
                const est = parseFloat(estimate);
                const name = event.toLowerCase();

                // Bullish if High: GDP, PMI, Production, Sales
                if (name.includes("gdp") || name.includes("pmi") || name.includes("production") || name.includes("sales")) {
                    return act >= est ? { label: "BULLISH", color: "text-green-500", icon: "fa-arrow-up" } : { label: "BEARISH", color: "text-red-500", icon: "fa-arrow-down" };
                }
                // Bearish if High: Inflation, CPI, PPI, Interest Rates, Unemployment
                if (name.includes("cpi") || name.includes("inflation") || name.includes("interest") || name.includes("unemployment")) {
                    return act > est ? { label: "BEARISH", color: "text-red-500", icon: "fa-arrow-down" } : { label: "BULLISH", color: "text-green-500", icon: "fa-arrow-up" };
                }
                return { label: "NEUTRAL", color: "text-indigo-400", icon: "fa-minus" };
            };

            const filteredEvents = useMemo(() => {
                return events.filter(e => {
                    const impactInfo = getImpactData(e.impact);
                    return selectedImpacts.includes(impactInfo.label) && selectedCountries.includes(e.country);
                }).sort((a, b) => a.time.localeCompare(b.time));
            }, [events, selectedCountries, selectedImpacts]);

            return (
                <div class="min-h-screen pb-10">
                    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-radar text-indigo-500 text-xl"></i>
                            <h1 class="text-lg font-black tracking-tighter uppercase">Nifty<span class="text-indigo-500">Pulse</span></h1>
                        </div>
                        <div class="flex gap-2">
                            <button onClick={fetchData} class="text-[10px] font-black bg-indigo-600 text-white px-4 py-2 rounded-xl">SYNC</button>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} class="h-10 w-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
                                <i class={`fas ${isDarkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-400'}`}></i>
                            </button>
                        </div>
                    </nav>

                    <div class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <aside class="lg:col-span-3 space-y-4">
                            <div class="bg-white dark:bg-darkCard p-6 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-xl">
                                <label class="text-[10px] font-black text-slate-400 uppercase block mb-4">Date</label>
                                <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} class="w-full bg-slate-50 dark:bg-slate-900 rounded-2xl p-4 text-sm font-bold mb-6 outline-none" />
                                
                                <label class="text-[10px] font-black text-slate-400 uppercase block mb-4">Impact</label>
                                <div class="space-y-2 mb-6">
                                    {["High", "Medium", "Low"].map(level => (
                                        <button key={level} onClick={() => toggleFilter(selectedImpacts, setSelectedImpacts, level)} 
                                            class={`w-full flex justify-between px-4 py-3 rounded-2xl text-xs font-bold border transition-all ${selectedImpacts.includes(level) ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'border-slate-100 dark:border-slate-800 text-slate-500'}`}>
                                            {level}
                                        </button>
                                    ))}
                                </div>

                                <label class="text-[10px] font-black text-slate-400 uppercase block mb-4">Regions</label>
                                <div class="grid grid-cols-2 gap-2">
                                    {["IN", "US", "CN", "JP"].map(id => (
                                        <button key={id} onClick={() => toggleFilter(selectedCountries, setSelectedCountries, id)}
                                            class={`py-2 rounded-xl text-xs font-black border transition-all ${selectedCountries.includes(id) ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900' : 'border-slate-100 dark:border-slate-800 text-slate-400'}`}>
                                            {id}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </aside>

                        <main class="lg:col-span-9 space-y-4">
                            {loading ? <div class="text-center py-20 font-black text-slate-400 animate-pulse">UPDATING FEED...</div> : 
                                filteredEvents.map((e, i) => {
                                    const impact = getImpactData(e.impact);
                                    const utcDate = new Date(e.time.includes('Z') ? e.time : e.time + 'Z');
                                    const displayTime = utcDate.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true });
                                    const bias = getNiftyBias(e.event, e.actual, e.estimate);
                                    const isOverdue = !e.actual && (new Date() > utcDate);

                                    return (
                                        <div key={i} class={`bg-white dark:bg-darkCard p-6 rounded-[2rem] border border-slate-200 dark:border-slate-800 transition-all ${impact.class}`}>
                                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                <div class="flex-1">
                                                    <div class="flex flex-wrap items-center gap-3 mb-2">
                                                        <span class="text-[10px] font-black px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded uppercase">{e.country}</span>
                                                        <span class={`text-[10px] font-black ${impact.color}`}>{impact.label} IMPACT</span>
                                                        <span class="text-[10px] font-bold text-slate-400 uppercase">{displayTime} IST</span>
                                                        {isOverdue && <span class="text-[9px] font-black text-orange-500 animate-pulse-slow px-2 py-1 bg-orange-50 dark:bg-orange-900/20 rounded">OVERDUE</span>}
                                                    </div>
                                                    <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 leading-tight">{e.event}</h3>
                                                </div>

                                                <div class="flex items-center gap-6 border-t md:border-t-0 md:border-l border-slate-100 dark:border-slate-800 pt-4 md:pt-0 md:pl-6">
                                                    <div class="text-center min-w-[65px]">
                                                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Actual</p>
                                                        <p class="font-mono text-base font-black text-indigo-500">{e.actual || '---'}</p>
                                                    </div>
                                                    <div class="text-center min-w-[65px]">
                                                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Forecast</p>
                                                        <p class="font-mono text-base font-bold text-slate-400">{e.estimate || '---'}</p>
                                                    </div>
                                                    <div class="text-center min-w-[90px] px-4 border-l border-slate-50 dark:border-slate-800">
                                                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Nifty Bias</p>
                                                        <p class={`text-[10px] font-black flex items-center justify-center gap-1 ${bias.color}`}>
                                                            <i class={`fas ${bias.icon}`}></i> {bias.label}
                                                        </p>
                                                    </div>
                                                    <a href={`https://www.google.com/search?q=${encodeURIComponent(e.country + ' ' + e.event + ' actual value ' + date)}`} target="_blank" 
                                                       class="h-10 w-10 flex items-center justify-center bg-slate-100 dark:bg-slate-800 rounded-xl hover:bg-indigo-500 hover:text-white transition-all">
                                                        <i class="fas fa-search"></i>
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })
                            }
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
