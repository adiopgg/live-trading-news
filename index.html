<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiftyPulse Pro | Live News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkBg: '#0f172a', darkCard: '#1e293b' } } }
        }
    </script>
    <style>
        .impact-1 { border-left: 6px solid #ef4444; }
        .impact-2 { border-left: 6px solid #f59e0b; }
        .impact-3 { border-left: 6px solid #10b981; }
        .glass { backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const API_KEY = 'd7p2ldhr01qr68pbg1l0d7p2ldhr01qr68pbg1lg';

        function App() {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(true);
            
            // Multi-select states
            const [selectedCountries, setSelectedCountries] = useState(["IN", "US", "CN"]);
            const [selectedImpacts, setSelectedImpacts] = useState(["1", "2"]);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);

            const countries = [
                { id: "IN", label: "🇮🇳 India" },
                { id: "US", label: "🇺🇸 USA" },
                { id: "CN", label: "🇨🇳 China" },
                { id: "JP", label: "🇯🇵 Japan" },
                { id: "EU", label: "🇪🇺 Europe" },
                { id: "GB", label: "🇬🇧 UK" }
            ];

            useEffect(() => {
                document.documentElement.classList.toggle('dark', isDarkMode);
                fetchData();
                const interval = setInterval(fetchData, 60000);
                return () => clearInterval(interval);
            }, [date, isDarkMode]);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const response = await fetch(`https://finnhub.io/api/v1/calendar/economic?from=${date}&to=${date}&token=${API_KEY}`);
                    const data = await response.json();
                    setEvents(data.economicCalendar || []);
                } catch (err) { console.error("Fetch Error:", err); }
                setLoading(false);
            };

            const toggleFilter = (list, setList, item) => {
                if (list.includes(item)) {
                    setList(list.filter(i => i !== item));
                } else {
                    setList([...list, item]);
                }
            };

            const getSmartBias = (e) => {
                if (!e.actual || !e.estimate) return { label: "Neutral", color: "text-slate-400", icon: "fa-minus" };
                const name = e.event.toLowerCase();
                const actual = parseFloat(e.actual);
                const estimate = parseFloat(e.estimate);
                const isInverse = name.includes("unemployment") || name.includes("claims") || name.includes("deficit");
                let isBullish = actual > estimate;
                if (isInverse) isBullish = !isBullish;
                
                return isBullish 
                    ? { label: "Bullish", color: "text-green-500", icon: "fa-circle-up" }
                    : { label: "Bearish", color: "text-red-500", icon: "fa-circle-down" };
            };

            const filteredEvents = useMemo(() => {
                return events.filter(e => {
                    // Impact logic fix: Finnhub returns impact as 1 (High), 2 (Med), 3 (Low)
                    const impactMatch = selectedImpacts.length === 0 || selectedImpacts.includes(e.impact.toString());
                    const countryMatch = selectedCountries.length === 0 || selectedCountries.includes(e.country);
                    return impactMatch && countryMatch;
                });
            }, [events, selectedCountries, selectedImpacts]);

            return (
                <div class="min-h-screen">
                    <nav class="sticky top-0 z-50 glass bg-white/70 dark:bg-darkCard/70 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-chart-line text-indigo-500 text-2xl"></i>
                            <h1 class="text-xl font-bold tracking-tighter">NIFTY<span class="text-indigo-500">PULSE</span></h1>
                        </div>
                        
                        <div class="flex items-center gap-6">
                            <div class="hidden md:block text-[10px] font-bold text-slate-500 text-right uppercase">
                                <div>Market Status: Live</div>
                                <div>{new Date().toLocaleTimeString('en-IN')} IST</div>
                            </div>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 transition-colors">
                                <i class={`fas ${isDarkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-600'}`}></i>
                            </button>
                        </div>
                    </nav>

                    <div class="max-w-7xl mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        <aside class="lg:col-span-3 space-y-6">
                            <div class="bg-white dark:bg-darkCard p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-3">Calendar Date</label>
                                <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-xl p-3 text-sm font-bold dark:text-white" />

                                <div class="my-6 border-t border-slate-100 dark:border-slate-800"></div>

                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-3">Impact Levels (Select Multiple)</label>
                                <div class="flex flex-wrap gap-2">
                                    {[["1", "High"], ["2", "Med"], ["3", "Low"]].map(([val, label]) => (
                                        <button key={val} onClick={() => toggleFilter(selectedImpacts, setSelectedImpacts, val)} 
                                            class={`px-3 py-2 rounded-xl text-xs font-bold border transition ${selectedImpacts.includes(val) ? 'bg-indigo-500 border-indigo-500 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-500'}`}>
                                            {label}
                                        </button>
                                    ))}
                                </div>

                                <div class="my-6 border-t border-slate-100 dark:border-slate-800"></div>

                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-3">Priority Countries</label>
                                <div class="grid grid-cols-1 gap-2">
                                    {countries.map(c => (
                                        <button key={c.id} onClick={() => toggleFilter(selectedCountries, setSelectedCountries, c.id)}
                                            class={`text-left px-4 py-3 rounded-xl text-sm font-semibold transition ${selectedCountries.includes(c.id) ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 border border-indigo-200 dark:border-indigo-800' : 'text-slate-500 border border-transparent hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                                            {c.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </aside>

                        <main class="lg:col-span-9">
                            {loading ? (
                                <div class="flex justify-center py-20"><i class="fas fa-spinner animate-spin text-3xl text-indigo-500"></i></div>
                            ) : filteredEvents.length > 0 ? (
                                <div class="space-y-4">
                                    {filteredEvents.map((e, i) => {
                                        const bias = getSmartBias(e);
                                        const impactLabel = e.impact === 1 ? 'HIGH' : e.impact === 2 ? 'MED' : 'LOW';
                                        return (
                                            <div key={i} class={`bg-white dark:bg-darkCard p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-6 impact-${e.impact} hover:scale-[1.01] transition-transform`}>
                                                
                                                <div class="flex-1">
                                                    <div class="flex items-center gap-3 mb-2">
                                                        <span class="text-[10px] font-black px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded">{e.country}</span>
                                                        <span class={`text-[10px] font-black px-2 py-1 rounded bg-opacity-10 ${e.impact === 1 ? 'bg-red-500 text-red-500' : 'bg-orange-500 text-orange-500'}`}>
                                                            {impactLabel} IMPACT
                                                        </span>
                                                        <span class="text-xs font-bold text-slate-400">
                                                            {new Date(e.time).toLocaleTimeString('en-IN', {timeZone: 'Asia/Kolkata', hour: '2-digit', minute:'2-digit'})} IST
                                                        </span>
                                                    </div>
                                                    <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">{e.event}</h3>
                                                </div>

                                                <div class="grid grid-cols-3 gap-8 border-t md:border-t-0 md:border-l border-slate-100 dark:border-slate-800 pt-4 md:pt-0 md:pl-8">
                                                    <div class="text-center">
                                                        <p class="text-[10px] font-bold text-slate-400 uppercase">Actual</p>
                                                        <p class="font-mono text-sm font-bold text-indigo-500">{e.actual || '---'}</p>
                                                    </div>
                                                    <div class="text-center">
                                                        <p class="text-[10px] font-bold text-slate-400 uppercase">Forecast</p>
                                                        <p class="font-mono text-sm text-slate-500 dark:text-slate-400">{e.estimate || '---'}</p>
                                                    </div>
                                                    <div class="text-center">
                                                        <p class="text-[10px] font-bold text-slate-400 uppercase">Bias</p>
                                                        <div class={`flex items-center gap-1 text-xs font-black ${bias.color}`}>
                                                            <i class={`fas ${bias.icon}`}></i> {bias.label}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div class="text-center py-20 bg-white dark:bg-darkCard rounded-3xl border-2 border-dashed border-slate-200 dark:border-slate-700">
                                    <p class="text-slate-400 font-bold">No results found for selected filters.</p>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
